<!doctype html>
<html lang="hi" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070a">
<meta name="color-scheme" content="dark light">
<title>JAAT MATCH</title>
<script>
/* theme + TV pehchaan - page dikhne se pehle, taaki flash na ho */
(function(){
  var d = document.documentElement, t = null, tv = false;
  try{ t = localStorage.getItem("jm_theme"); }catch(e){}
  tv = /Android TV|SmartTV|SMART-TV|Tizen|Web0S|WebOS|BRAVIA|GoogleTV|HbbTV|CrKey|AFT[A-Z]|NETTV/i.test(navigator.userAgent) || /[?&]tv=1/.test(location.search);
  if(tv) d.classList.add("tv");
  if(t !== "light" && t !== "dark"){
    t = (!tv && window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches) ? "light" : "dark";
  }
  d.setAttribute("data-theme", t);
  var m = document.querySelector('meta[name="theme-color"]');
  if(m) m.content = t === "dark" ? "#05070a" : "#edf1f7";
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
<script src="https://cdn.dashjs.org/latest/dash.all.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
<script src="https://cdn.dashjs.org/latest/dash.all.min.js"></script>
<style>
  /* ================= theme tokens ================= */
  :root{
    --bg:#05070a; --glow1:rgba(46,224,176,.15); --glow2:rgba(56,169,245,.14);
    --head:rgba(11,14,20,.84); --panel:rgba(13,17,24,.68);
    --card:#10151e; --card-hi:#171e2b; --field:#0b0d12;
    --line:#1d2430; --line2:#2d3646;
    --txt:#eef3fb; --dim:#8f9cb0; --mute:#5f6b7d;
    --acc:#2ee0b0; --acc2:#38a9f5; --acc-ink:#03211b; --acc-soft:rgba(46,224,176,.13);
    --t-hls:#8ef0c8; --t-dash:#9ed2ff; --t-web:#ffd79a;
    --shadow:0 8px 26px rgba(0,0,0,.45);
    color-scheme:dark;
  }
  :root[data-theme="light"]{
    --bg:#edf1f7; --glow1:rgba(15,185,143,.14); --glow2:rgba(42,134,224,.13);
    --head:rgba(255,255,255,.86); --panel:rgba(255,255,255,.72);
    --card:#ffffff; --card-hi:#f1f5fa; --field:#ffffff;
    --line:#dae2ed; --line2:#c2cddc;
    --txt:#0f1722; --dim:#59677b; --mute:#8794a7;
    --acc:#0fb98f; --acc2:#2a86e0; --acc-ink:#ffffff; --acc-soft:rgba(15,185,143,.12);
    --t-hls:#087a5c; --t-dash:#1a6fc0; --t-web:#a05d00;
    --shadow:0 8px 24px rgba(40,60,90,.15);
    color-scheme:light;
  }

  /* ================= base ================= */
  html{font-size:16px}
  html.tv{font-size:19px}
  @media (min-width:1500px){ html{font-size:19px} html.tv{font-size:22px} }
  @media (min-width:2200px){ html{font-size:26px} html.tv{font-size:30px} }

  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:
      radial-gradient(60rem 32rem at 8% -12%, var(--glow1) 0%, transparent 62%),
      radial-gradient(60rem 32rem at 96% -8%, var(--glow2) 0%, transparent 58%),
      var(--bg);
    color:var(--txt);
    font-family:ui-sans-serif,system-ui,"Segoe UI",Roboto,Arial,sans-serif;
    font-size:.94rem;
    display:flex; flex-direction:column; height:100dvh; overflow:hidden;
    -webkit-tap-highlight-color:transparent; -webkit-font-smoothing:antialiased;
  }
  button{font:inherit}
  :focus{outline:none}
  :focus-visible{outline:.18rem solid var(--acc); outline-offset:.15rem}

  /* ================= header ================= */
  header{
    display:flex; align-items:center; gap:.7rem; padding:.7rem .9rem; flex:0 0 auto;
    background:var(--head); border-bottom:1px solid var(--line);
    backdrop-filter:blur(16px) saturate(1.2); box-shadow:var(--shadow);
    position:relative; z-index:20;
  }
  .mark{
    width:2.4rem; height:2.4rem; border-radius:.75rem; flex:0 0 auto;
    background:linear-gradient(140deg,var(--acc),#0d8a70 56%,var(--acc2));
    display:grid; place-items:center; font-size:.86rem; font-weight:900;
    color:#03211b; letter-spacing:-.04em; box-shadow:0 0 1.3rem var(--acc-soft);
  }
  .brand{display:flex; flex-direction:column; line-height:1.1}
  .brand b{
    font-size:1.08rem; font-weight:900; letter-spacing:.14em;
    background:linear-gradient(92deg,var(--txt),var(--acc) 58%,var(--acc2));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .brand i{font-style:normal; font-size:.56rem; letter-spacing:.34em; color:var(--mute); font-weight:800}
  .cnt{
    font-size:.72rem; color:var(--dim); font-family:ui-monospace,monospace;
    border:1px solid var(--line); border-radius:2rem; padding:.25rem .65rem;
    background:var(--card); letter-spacing:.03em;
  }
  .spacer{flex:1}
  .ico{
    width:2.6rem; height:2.6rem; border-radius:.85rem; flex:0 0 auto;
    border:1px solid var(--line); background:var(--card); color:var(--dim);
    font-size:1.15rem; line-height:1; cursor:pointer; display:grid; place-items:center;
    transition:.15s; box-shadow:0 2px 8px rgba(0,0,0,.12);
  }
  .ico svg{width:1.25rem; height:1.25rem}
  .ico:active{transform:scale(.92)}
  .ico.spin{animation:sp .55s linear}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media (hover:hover){ .ico:hover{color:var(--txt); border-color:var(--line2); background:var(--card-hi)} }

  /* ================= layout ================= */
  main{flex:1; min-height:0; display:flex; flex-direction:column}
  #stage{flex:0 0 auto; background:#030508; border-bottom:1px solid var(--line)}
  #listPane{flex:1; display:flex; flex-direction:column; min-height:0}

  /* laptop / TV / phone landscape: player left, list right */
  @media (min-width:900px) and (orientation:landscape){
    main{flex-direction:row; gap:1.1rem; padding:1.1rem}
    #stage{
      flex:1 1 0; min-width:0; background:none; border:0; overflow:hidden;
      display:flex; flex-direction:column; gap:.8rem;
    }
    #playerBox{
      aspect-ratio:16/9; min-height:0; max-height:calc(100dvh - 8.6rem);
      border-radius:1.1rem; border:1px solid var(--line); box-shadow:var(--shadow);
    }
    #nowBar{border:1px solid var(--line); border-radius:1rem; background:var(--panel)}
    #listPane{
      flex:0 0 clamp(300px,31vw,480px); overflow:hidden;
      border:1px solid var(--line); border-radius:1.1rem; background:var(--panel);
      backdrop-filter:blur(10px);
    }
  }

  /* ================= player ================= */
  #playerBox{
    position:relative; width:100%; aspect-ratio:16/10; min-height:252px;
    max-height:58dvh; margin:0 auto; background:#030508; overflow:hidden;
  }
  #playerBox:fullscreen{
    aspect-ratio:auto; max-height:none; height:100dvh; width:100vw; border:0; border-radius:0;
  }
  #playerBox.rot{
    position:fixed; top:0; left:100vw; width:100dvh; height:100vw; max-height:none;
    aspect-ratio:auto; border:0; border-radius:0; z-index:9999;
    transform-origin:top left; transform:rotate(90deg);
  }
  video, iframe{
    position:absolute; inset:0; width:100%; height:100%; border:0;
    background:#030508; display:none; z-index:1;
  }
  video{object-fit:contain}

  #empty{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:.65rem; color:#93a0b3; font-size:.85rem;
    text-align:center; padding:1.2rem; pointer-events:none; z-index:2;
  }
  #empty .ring{
    width:3.7rem; height:3.7rem; border-radius:50%; border:1px dashed #2e3847;
    display:grid; place-items:center; font-size:1.3rem; color:#4d5768;
    background:radial-gradient(circle,rgba(46,224,176,.1),transparent 70%);
    animation:pulse 2.7s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:1;transform:scale(1.06)}}
  #empty b{
    font-size:1rem; letter-spacing:.03em;
    background:linear-gradient(90deg,#eef4fb,#a6b3c6);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  #empty span{font-size:.8rem; color:#6f7a8b}

  #status{
    position:absolute; top:.65rem; left:.65rem; z-index:7; max-width:44%;
    font-family:ui-monospace,monospace; font-size:.68rem; color:#cbd5e3;
    background:rgba(9,12,18,.7); backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.1); border-radius:999px;
    padding:.38rem .7rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    pointer-events:none; transition:opacity .4s; opacity:0;
  }
  #status.show{opacity:1}
  #status.err{color:#ffb3c0; border-color:rgba(244,82,106,.45); background:rgba(40,10,16,.8)}

  /* fullscreen button: neeche-right, tap par aata hai, 3 sec baad chala jata hai */
  #fsBtn{
    position:absolute; z-index:9; right:.6rem; bottom:.6rem;
    width:2.4rem; height:2rem; padding:0; border-radius:.6rem;
    border:1px solid rgba(255,255,255,.16); background:rgba(10,13,19,.78);
    backdrop-filter:blur(10px); color:#d3dcea; cursor:pointer;
    display:grid; place-items:center; font-size:1rem;
    box-shadow:0 3px 14px rgba(0,0,0,.5);
    opacity:0; pointer-events:none; transition:opacity .25s, transform .15s;
  }
  #playerBox.fsvis #fsBtn{opacity:1; pointer-events:auto}
  #fsBtn:active{transform:scale(.9)}
  #fsBtn:focus-visible{opacity:1}
  #playerBox:fullscreen #fsBtn, #playerBox.rot #fsBtn{
    right:1rem; bottom:1rem; width:2.9rem; height:2.4rem; border-radius:.75rem;
  }
  /* iframe ke upar tap pakadne ka chhota invisible corner (sirf WEB channel) */
  #fsHot{position:absolute; bottom:0; right:0; width:3.6rem; height:3.6rem; z-index:8; display:none}
  /* WEB channel: button hamesha dikhe, upar-right me (neeche source ke apne controls hote hain) */
  #playerBox.wmode #fsHot{display:none !important}
  #playerBox.wmode #fsBtn{opacity:.85; pointer-events:auto; bottom:auto; top:.6rem}
  #playerBox.wmode:fullscreen #fsBtn, #playerBox.wmode.rot #fsBtn{top:1rem; bottom:auto}

  /* ================= now playing ================= */
  #nowBar{
    display:flex; align-items:center; gap:.6rem; padding:.62rem .9rem;
    background:var(--head); border-bottom:1px solid var(--line); min-height:2.7rem;
  }
  #nowBar .dot{
    width:.55rem; height:.55rem; border-radius:50%; background:var(--mute); flex:0 0 auto;
  }
  #nowBar.live .dot{background:#f4526a; animation:blink 1.4s ease-in-out infinite}
  @keyframes blink{0%,100%{box-shadow:0 0 0 0 rgba(244,82,106,.55)}60%{box-shadow:0 0 0 .45rem rgba(244,82,106,0)}}
  #nowName{
    flex:1; min-width:0; font-size:.95rem; font-weight:700; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis;
  }

  /* ================= list ================= */
  #tools{padding:.8rem .8rem .5rem; flex:0 0 auto; position:relative}
  #tools svg{
    position:absolute; left:1.7rem; top:50%; margin-top:.15rem; transform:translateY(-50%);
    width:1.1rem; height:1.1rem; color:var(--mute); pointer-events:none;
  }
  #search{
    width:100%; background:var(--field); border:1px solid var(--line); color:var(--txt);
    border-radius:.95rem; padding:.8rem 1rem .8rem 2.7rem; font-size:1rem;
    transition:.15s; box-shadow:0 2px 10px rgba(0,0,0,.12) inset;
  }
  #search:focus{border-color:var(--acc); box-shadow:0 0 0 .2rem var(--acc-soft)}
  #search::placeholder{color:var(--mute)}

  #list{
    flex:1; overflow-y:auto; overflow-x:hidden; padding:.15rem .8rem 1.4rem;
    -webkit-overflow-scrolling:touch; scrollbar-width:thin; scrollbar-color:var(--line2) transparent;
  }
  #list::-webkit-scrollbar{width:6px}
  #list::-webkit-scrollbar-thumb{background:var(--line2); border-radius:9px}

  .row{
    display:flex; align-items:center; gap:.7rem; padding:.7rem .8rem; margin-bottom:.5rem;
    border:1px solid var(--line); border-radius:1rem; background:var(--card);
    cursor:pointer; transition:.15s; position:relative; overflow:hidden;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
  }
  .row::before{
    content:""; position:absolute; left:0; top:0; bottom:0; width:.2rem;
    background:linear-gradient(180deg,var(--acc),var(--acc2)); opacity:0; transition:.18s;
  }
  @media (hover:hover){
    .row:hover{border-color:var(--line2); background:var(--card-hi)}
    .row:hover::before{opacity:1}
    .row:hover .play{background:linear-gradient(140deg,var(--acc),var(--acc2)); color:var(--acc-ink); border-color:transparent}
  }
  .row:focus-visible{transform:scale(1.015); border-color:var(--acc); background:var(--card-hi)}
  .row:focus-visible::before{opacity:1}
  .row.on{border-color:var(--acc); background:linear-gradient(160deg,var(--acc-soft),var(--card))}
  .row.on::before{opacity:1}

  .num{
    flex:0 0 auto; min-width:1.75rem; height:1.75rem; border-radius:.55rem;
    display:grid; place-items:center; font-size:.68rem; font-weight:800;
    font-family:ui-monospace,monospace; color:var(--dim);
    background:var(--card-hi); border:1px solid var(--line);
  }
  .row.on .num{color:var(--acc-ink); background:linear-gradient(140deg,var(--acc),var(--acc2)); border-color:transparent}
  .nm{
    flex:1; min-width:0; font-size:.95rem; font-weight:600; line-height:1.3;
    color:var(--txt); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .row.on .nm{color:var(--acc)}
  .tag{
    flex:0 0 auto; font-size:.55rem; font-weight:800; letter-spacing:.07em;
    padding:.26rem .46rem; border-radius:.4rem; font-family:ui-monospace,monospace;
    color:var(--dim); background:var(--card-hi); border:1px solid var(--line);
  }
  .tag.hls, .tag.file{color:var(--t-hls); border-color:currentColor; background:transparent}
  .tag.dash{color:var(--t-dash); border-color:currentColor; background:transparent}
  .tag.web{color:var(--t-web); border-color:currentColor; background:transparent}
  .play{
    flex:0 0 auto; width:2.1rem; height:2.1rem; border-radius:.65rem; display:grid;
    place-items:center; font-size:.72rem; color:var(--dim);
    background:var(--card-hi); border:1px solid var(--line); transition:.15s;
  }
  .row.on .play, .row:focus-visible .play{
    background:linear-gradient(140deg,var(--acc),var(--acc2)); color:var(--acc-ink); border-color:transparent;
  }

  .msg{text-align:center; padding:2rem 1rem; color:var(--dim); font-size:.85rem; line-height:1.7}
  .msg b{display:block; color:var(--txt); font-size:.95rem; margin-bottom:.35rem}
  .msg button{
    margin-top:.85rem; padding:.7rem 1.3rem; border-radius:.8rem; cursor:pointer;
    border:1px solid var(--acc); background:var(--acc-soft); color:var(--acc); font-weight:700;
  }

  /* ================= credit ================= */
  .credit{
    margin:1rem 0 .25rem; border-radius:1.05rem; padding:.95rem 1rem;
    display:flex; align-items:center; gap:.8rem; text-decoration:none;
    background:linear-gradient(135deg,#2a1f07,#4a3410 42%,#241a06 100%);
    border:1px solid rgba(255,205,110,.36);
    box-shadow:0 10px 30px rgba(0,0,0,.35), 0 0 0 1px rgba(255,215,130,.1) inset;
    position:relative; overflow:hidden;
  }
  .credit::after{
    content:""; position:absolute; top:-60%; left:-30%; width:60%; height:220%;
    background:linear-gradient(90deg,transparent,rgba(255,225,150,.14),transparent);
    transform:rotate(18deg);
  }
  .credit .av{
    width:2.5rem; height:2.5rem; border-radius:.7rem; flex:0 0 auto; display:grid;
    place-items:center; font-size:.95rem; font-weight:900; color:#2a1f07;
    background:linear-gradient(140deg,#ffdf9b,#e0b455 60%,#b8892f);
  }
  .credit .tx{flex:1; min-width:0}
  .credit .tx b{display:block; font-size:.85rem; font-weight:900; letter-spacing:.1em; color:#ffe9b8}
  .credit .tx span{font-size:.7rem; color:#c2a978; font-family:ui-monospace,monospace}
  .credit .go{
    flex:0 0 auto; font-size:.62rem; font-weight:800; letter-spacing:.05em;
    color:#2a1f07; background:linear-gradient(140deg,#ffdf9b,#e0b455);
    padding:.5rem .7rem; border-radius:.55rem;
  }
  footer{
    text-align:center; font-size:.62rem; color:var(--mute); padding:.9rem 0 .1rem;
    letter-spacing:.14em; font-family:ui-monospace,monospace;
  }
</style>
</head>
<body>

<header>
  <div class="mark">JM</div>
  <div class="brand"><b>JAAT MATCH</b><i>LIVE CRICKET</i></div>
  <div class="cnt" id="cnt">--</div>
  <div class="spacer"></div>
  <button class="ico" id="theme" title="Dark / Light" aria-label="Dark / Light theme"></button>
  <button class="ico" id="reload" title="Reload" aria-label="Reload">&#x21bb;</button>
</header>

<main>
  <section id="stage">
    <div id="playerBox">
      <video id="vid" playsinline disablepictureinpicture disableremoteplayback></video>
      <iframe id="fr" allowfullscreen allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
        referrerpolicy="no-referrer"
        sandbox="allow-scripts allow-presentation allow-orientation-lock"></iframe>
      <div id="empty">
        <div class="ring">&#9654;</div>
        <b>Koi channel chuno</b>
        <span>list se chuno, video yahin chalega</span>
      </div>
      <div id="status"></div>
      <div id="fsHot"></div>
      <button id="fsBtn" title="Fullscreen" aria-label="Fullscreen">&#x26F6;</button>
    </div>
    <div id="nowBar">
      <span class="dot"></span>
      <b id="nowName">Koi channel nahi chuna</b>
      <span class="tag" id="nowTag" style="display:none"></span>
    </div>
  </section>

  <section id="listPane">
    <div id="tools">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="search" type="search" placeholder="Channel / match search karo..." autocomplete="off">
    </div>
    <div id="list"><div class="msg">List load ho rahi hai...</div></div>
  </section>
</main>

<script>
(function(){
  "use strict";

  var $ = function(s){ return document.querySelector(s); };
  var vid = $("#vid"), fr = $("#fr"), box = $("#playerBox"), fsBtn = $("#fsBtn"),
      listEl = $("#list"), cntEl = $("#cnt"), stEl = $("#status"), emptyEl = $("#empty"),
      searchEl = $("#search"), nowBar = $("#nowBar"), nowName = $("#nowName"), nowTag = $("#nowTag"),
      themeBtn = $("#theme"), root = document.documentElement;

  var ALL = [], shown = [], activeId = null, hls = null, dash = null, cacheKey = "jm_links_v7";

  /* ---------------- theme ---------------- */
  var SUN  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  var MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';

  function setTheme(t){
    root.setAttribute("data-theme", t);
    themeBtn.innerHTML = t === "dark" ? SUN : MOON;      /* jis theme par jaoge uska icon */
    var m = document.querySelector('meta[name="theme-color"]');
    if(m) m.content = t === "dark" ? "#05070a" : "#edf1f7";
    try{ localStorage.setItem("jm_theme", t); }catch(e){}
  }
  themeBtn.onclick = function(){
    setTheme(root.getAttribute("data-theme") === "dark" ? "light" : "dark");
  };
  themeBtn.innerHTML = root.getAttribute("data-theme") === "dark" ? SUN : MOON;

  /* ---------------- status pill ---------------- */
  var stTimer;
  function say(t, err){
    stEl.textContent = t;
    stEl.className = "show" + (err ? " err" : "");
    clearTimeout(stTimer);
    stTimer = setTimeout(function(){ stEl.className = ""; }, err ? 4200 : 2200);
  }

  /* ---------------- helpers ---------------- */
  function lc(s){ return String(s || "").toLowerCase().replace(/[\s_-]/g, ""); }

  function tagText(k){ return k === "hls" ? "HLS" : k === "dash" ? "DASH" : k === "file" ? "FILE" : "WEB"; }

  /* ---------------- list ---------------- */
  function render(){
    var q = lc(searchEl.value);
    shown = q ? ALL.filter(function(x){ return lc(x.name).indexOf(q) > -1; }) : ALL;
    listEl.innerHTML = "";
    cntEl.textContent = ALL.length ? (shown.length + "/" + ALL.length) : "--";

    if(!shown.length){
      var d = document.createElement("div");
      d.className = "msg";
      d.innerHTML = ALL.length
        ? "<b>Kuch match nahi</b>dusra naam try karo"
        : "<b>List khali hai</b>reload dabao ya source check karo" +
          '<button id="again">Dobara try</button>';
      listEl.appendChild(d);
      var ag = $("#again");
      if(ag) ag.onclick = load;
      return;
    }

    var frag = document.createDocumentFragment();
    shown.forEach(function(it, i){
      var r = document.createElement("div");
      r.className = "row" + (it.id === activeId ? " on" : "");
      r.dataset.id = it.id;
      r.tabIndex = 0;
      r.setAttribute("role", "button");
      r.innerHTML =
        '<div class="num">' + (i + 1) + '</div>' +
        '<div class="nm"></div>' +
        '<div class="tag ' + it.kind + '">' + tagText(it.kind) + '</div>' +
        '<div class="play">&#9654;</div>';
      r.querySelector(".nm").textContent = it.name;
      r.onclick = function(){ play(it.id); };
      r.onkeydown = function(e){
        if(e.key === "Enter" || e.key === " "){ e.preventDefault(); play(it.id); }
      };
      frag.appendChild(r);
    });

    var cr = document.createElement("a");
    cr.className = "credit";
    cr.href = "https://t.me/mollad_jaat";
    cr.target = "_blank";
    cr.rel = "noopener";
    cr.innerHTML =
      '<div class="av">MJ</div>' +
      '<div class="tx"><b>MOLLAD JAAT</b><span>@mollad_jaat</span></div>' +
      '<div class="go">JOIN</div>';
    frag.appendChild(cr);

    var ft = document.createElement("footer");
    ft.textContent = "JAAT MATCH";
    frag.appendChild(ft);

    listEl.appendChild(frag);
  }

  /* list dobara banaye bina sirf highlight badlo (TV par focus na toote) */
  function markActive(){
    var rows = listEl.querySelectorAll(".row");
    for(var i = 0; i < rows.length; i++){
      rows[i].classList.toggle("on", Number(rows[i].dataset.id) === activeId);
    }
  }

  function setNow(it){
    nowName.textContent = it ? it.name : "Koi channel nahi chuna";
    nowTag.style.display = it ? "" : "none";
    nowTag.className = "tag" + (it ? " " + it.kind : "");
    nowTag.textContent = it ? tagText(it.kind) : "";
    nowBar.classList.toggle("live", !!it);
  }

  /* ---------------- player ---------------- */
  function stopAll(){
    try{ if(hls){ hls.destroy(); hls = null; } }catch(e){}
    try{ if(dash){ dash.reset(); dash = null; } }catch(e){}
    try{ vid.pause(); }catch(e){}
    vid.removeAttribute("src");
    vid.load();
    vid.style.display = "none";
    fr.style.display = "none";
    fr.removeAttribute("src");
    box.classList.remove("wmode", "fsvis");
  }

  function play(id){
    var it = ALL.filter(function(x){ return x.id === id; })[0];
    if(!it) return;
    var su = location.origin + "/s?t=" + encodeURIComponent(it.t);
    activeId = id;
    stopAll();
    emptyEl.style.display = "none";
    box.classList.toggle("wmode", it.kind === "web");

    if(it.kind === "web"){
      fr.src = "/p?t=" + encodeURIComponent(it.t);   /* source url client ko nahi dikhta */
      fr.style.display = "block";
      say("WEB · " + it.name);
    } else if(it.kind === "dash"){
      vid.style.display = "block";
      if(window.dashjs){
        dash = dashjs.MediaPlayer().create();
        dash.initialize(vid, su, true);
        dash.on("error", function(){ say("DASH fail · proxy try karo", true); });
      } else {
        vid.src = su;
      }
      say("DASH · " + it.name);
    } else if(it.kind === "hls"){
      vid.style.display = "block";
      if(vid.canPlayType("application/vnd.apple.mpegurl")){
        vid.src = su;
      } else if(window.Hls && Hls.isSupported()){
        hls = new Hls({ lowLatencyMode: true, maxBufferLength: 24 });
        hls.loadSource(su);
        hls.attachMedia(vid);
        hls.on(Hls.Events.ERROR, function(e, d){
          if(d && d.fatal) say("HLS fail · " + (d.details || ""), true);
        });
      } else {
        say("HLS support nahi", true);
      }
      say("HLS · " + it.name);
      vid.play().catch(function(){});
    } else {
      vid.style.display = "block";
      vid.src = su;
      vid.play().catch(function(){});
      say("FILE · " + it.name);
    }

    markActive();
    setNow(it);
  }

  /* ---------------- fullscreen ---------------- */
  var realFs = false;

  function isFs(){
    return document.fullscreenElement === box || document.webkitFullscreenElement === box;
  }

  /* fullscreen me phone portrait reh jaye to box ko 90deg ghuma do (landscape),
     taaki iframe ko landscape size mile aur ads na aayein */
  function fit(){
    if(!realFs) return;
    if(!isFs()){ box.classList.remove("rot"); return; }
    box.classList.toggle("rot", window.innerHeight > window.innerWidth);
  }

  function unlockOrient(){
    if(screen.orientation && screen.orientation.unlock){
      try{ screen.orientation.unlock(); }catch(e){}
    }
  }

  function enterFs(){
    var lock = function(){
      realFs = true;
      var done = function(){ setTimeout(fit, 350); setTimeout(fit, 1000); };
      if(screen.orientation && screen.orientation.lock){
        screen.orientation.lock("landscape").then(done, done);
      } else done();
      fit();
    };
    if(box.requestFullscreen){
      box.requestFullscreen().then(lock).catch(function(){});
    } else if(box.webkitRequestFullscreen){
      box.webkitRequestFullscreen();
      lock();
    }
  }

  function exitFs(){
    realFs = false;
    box.classList.remove("rot");
    unlockOrient();
    if(document.fullscreenElement && document.exitFullscreen){
      document.exitFullscreen().catch(function(){});
    } else if(document.webkitFullscreenElement && document.webkitExitFullscreen){
      document.webkitExitFullscreen();
    }
  }

  fsBtn.onclick = function(){
    if(isFs()) exitFs(); else enterFs();
  };

  function lockLand(){
    if(screen.orientation && screen.orientation.lock){
      try{ screen.orientation.lock("landscape").catch(function(){}); }catch(e){}
    }
  }

  /* fullscreen me ho aur phone portrait ho gaya to dobara landscape lock;
     pehle se landscape ho to kuch nahi karta */
  var guard = null;
  function relock(){
    var el = document.fullscreenElement || document.webkitFullscreenElement;
    if(el && window.innerHeight > window.innerWidth) lockLand();
  }

  function fsChange(){
    var el = document.fullscreenElement || document.webkitFullscreenElement;
    if(el === box){
      fit();
    } else {
      realFs = false;
      box.classList.remove("rot");
    }
    if(el){
      lockLand();                                   /* box ho ya source player ka fullscreen */
      if(!guard) guard = setInterval(relock, 1000);
    } else {
      if(guard){ clearInterval(guard); guard = null; }
      unlockOrient();
    }
  }
  window.addEventListener("resize", fit);
  window.addEventListener("orientationchange", function(){ setTimeout(fit, 300); });
  window.addEventListener("orientationchange", relock);
  window.addEventListener("resize", relock);
  document.addEventListener("visibilitychange", relock);
  if(screen.orientation && screen.orientation.addEventListener){
    screen.orientation.addEventListener("change", relock);
  }
  document.addEventListener("fullscreenchange", fsChange);
  document.addEventListener("webkitfullscreenchange", fsChange);

  /* fullscreen button: tap / mouse / D-pad focus par aaye, 3 sec baad chala jaye */
  var fsTimer;
  function showFs(){
    box.classList.add("fsvis");
    clearTimeout(fsTimer);
    fsTimer = setTimeout(hideFs, 3000);
  }
  function hideFs(){
    if(document.activeElement === fsBtn) return;
    box.classList.remove("fsvis");
  }
  var hot = $("#fsHot");
  hot.addEventListener("pointerdown", showFs);
  hot.addEventListener("pointerenter", showFs);
  vid.addEventListener("click", showFs);               /* video par tap */
  box.addEventListener("mousemove", showFs);           /* laptop: mouse hilao */
  fsBtn.addEventListener("focus", showFs);
  fsBtn.addEventListener("blur", function(){ clearTimeout(fsTimer); fsTimer = setTimeout(hideFs, 1000); });
  /* iframe ke andar tap ho to focus parent se nikalta hai - usse bhi button dikhao */
  window.addEventListener("blur", function(){
    setTimeout(function(){
      if(document.activeElement === fr && box.classList.contains("wmode")) showFs();
    }, 0);
  });

  /* ---------------- keyboard / TV remote (D-pad) ---------------- */
  document.addEventListener("keydown", function(e){
    var k = e.key, t = e.target, typing = t === searchEl;

    if(isFs() && (k === "Escape" || k === "GoBack" || k === "BrowserBack" || e.keyCode === 4)){
      exitFs(); e.preventDefault(); return;
    }
    if(typing && k !== "ArrowDown" && k !== "ArrowUp") return;

    var rows = Array.prototype.slice.call(listEl.querySelectorAll(".row"));
    var i = rows.indexOf(document.activeElement);

    if(k === "ArrowDown" && rows.length){
      if(i < rows.length - 1){ rows[i + 1].focus(); e.preventDefault(); }
    } else if(k === "ArrowUp" && rows.length){
      if(i > 0){ rows[i - 1].focus(); e.preventDefault(); }
      else if(i === 0){ searchEl.focus(); e.preventDefault(); }
    } else if(k === "ArrowLeft" && i > -1 && window.innerWidth >= 900){
      fsBtn.focus(); e.preventDefault();                 /* list -> player button */
    } else if(k === "ArrowRight" && t === fsBtn){
      var on = listEl.querySelector(".row.on") || rows[0];
      if(on){ on.focus(); e.preventDefault(); }
    } else if(k === "/"){
      searchEl.focus(); e.preventDefault();
    } else if(k === "f" || k === "F"){
      fsBtn.onclick(); e.preventDefault();
    }
  });

  /* ---------------- load ---------------- */
  function tvFocus(){
    if(!root.classList.contains("tv") || document.activeElement !== document.body) return;
    var f = listEl.querySelector(".row");
    if(f) f.focus({ preventScroll: true });
  }

  function showFail(){
    listEl.innerHTML = '<div class="msg"><b>List nahi mili</b>' +
      'worker ka link se kholo ya reload dabao.' +
      '<button id="again">Dobara try</button></div>';
    var ag = $("#again");
    if(ag) ag.onclick = load;
    say("list fail", true);
  }

  function load(){
    listEl.innerHTML = '<div class="msg">List load ho rahi hai...</div>';

    var cache = null;
    try{ cache = JSON.parse(localStorage.getItem(cacheKey) || "null"); }catch(e){}

    if(cache && cache.items && cache.items.length){
      ALL = cache.items;
      render();
      tvFocus();
    }

    fetch("/list", { cache: "no-store", credentials: "omit" })
      .then(function(r){ if(!r.ok) throw 0; return r.json(); })
      .then(function(d){
        var items = d && d.items;
        if(!items || !items.length) throw 0;
        ALL = items;
        activeId = null;
        render();
        tvFocus();
        say(ALL.length + " channel mile");
        try{ localStorage.setItem(cacheKey, JSON.stringify({ items: items })); }catch(e){}
      })
      .catch(function(){ if(!ALL.length) showFail(); });
  }

  /* ---------------- events ---------------- */
  searchEl.oninput = render;
  $("#reload").onclick = function(){
    this.classList.remove("spin");
    void this.offsetWidth;
    this.classList.add("spin");
    stopAll();
    emptyEl.style.display = "flex";
    activeId = null;
    setNow(null);
    load();
  };

  load();
})();
</script>
</body>
</html>
